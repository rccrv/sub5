%dev.quarkus.http.port=8083
quarkus.http.access-log.enabled=true

quarkus.rest-client.compradores.url=${COMPRADORES_SERVICE_URL:http://compradores-service}
quarkus.rest-client.veiculos.url=${VEICULOS_SERVICE_URL:http://principal-service}
quarkus.rest-client.financeiro.url=${FINANCEIRO_SERVICE_URL:http://financeiro-service}

quarkus.oidc.auth-server-url=${KEYCLOAK_REALM_URL:http://keycloak/realms/sub3}
quarkus.oidc.client-id=${KEYCLOAK_CLIENT_ID:principal}
quarkus.oidc.credentials.secret=${KEYCLOAK_CLIENT_SECRET}
quarkus.oidc.application-type=service
quarkus.oidc-client.auth-server-url=${KEYCLOAK_REALM_URL:http://keycloak/realms/sub3}
quarkus.oidc-client.client-id=${KEYCLOAK_CLIENT_ID:principal}
quarkus.oidc-client.credentials.secret=${KEYCLOAK_CLIENT_SECRET}

%dev.quarkus.smallrye-openapi.security-scheme=jwt
%dev.quarkus.rest-client.compradores.url=${DEV_COMPRADORES_SERVICE_URL:http://localhost:8081}
%dev.quarkus.rest-client.veiculos.url=${DEV_VEICULOS_SERVICE_URL:http://localhost:8082}
%dev.quarkus.rest-client.financeiro.url=${DEV_FINANCEIRO_SERVICE_URL:http://localhost:8084}
%dev.quarkus.oidc.auth-server-url=${DEV_KEYCLOAK_REALM_URL:http://localhost:8080/realms/sub3}
%dev.quarkus.oidc.client-id=${DEV_KEYCLOAK_CLIENT_ID:principal}
%dev.quarkus.oidc.credentials.secret=${DEV_KEYCLOAK_CLIENT_SECRET}
%dev.quarkus.oidc.application-type=service
%dev.quarkus.oidc-client.auth-server-url=${DEV_KEYCLOAK_REALM_URL:http://localhost:8080/realms/sub3}
%dev.quarkus.oidc-client.client-id=${DEV_KEYCLOAK_CLIENT_ID:principal}
%dev.quarkus.oidc-client.credentials.secret=${DEV_KEYCLOAK_CLIENT_SECRET}

%dev.quarkus.kafka.devservices.enabled=false
%dev.kafka.bootstrap.servers=${DEV_KAFKA_SERVER:localhost:9092}

mp.messaging.outgoing.financeiro-out.connector=smallrye-kafka
mp.messaging.outgoing.financeiro-out.topic=financeiro

mp.messaging.incoming.financeiro-in.connector=smallrye-kafka
mp.messaging.incoming.financeiro-in.topic=financeiro-ack
