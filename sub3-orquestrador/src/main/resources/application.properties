%dev.quarkus.http.port=8083
quarkus.http.access-log.enabled=true

quarkus.rest-client.compradores.url=${COMPRADORES_SERVICE_URL:http://compradores-service}
quarkus.rest-client.veiculos.url=${VEICULOS_SERVICE_URL:http://principal-service}
quarkus.rest-client.financeiro.url=${FINANCEIRO_SERVICE_URL:http://financeiro-service}

quarkus.kafka.devservices.enabled=false
kafka.bootstrap.servers=${KAFKA_SERVER:localhost:9092}

# Cognito access tokens are verified locally using the issuer's published JWKS.
# The Cognito user-pool groups are the application's funcionario/comprador/financeiro roles.
quarkus.oidc.auth-server-url=${COGNITO_ISSUER_URL}
quarkus.oidc.application-type=service
quarkus.oidc.roles.role-claim-path="cognito:groups"
quarkus.oidc.token.principal-claim=username
quarkus.oidc.token.subject-required=true

%dev.quarkus.smallrye-openapi.security-scheme=jwt
%dev.quarkus.rest-client.compradores.url=${DEV_COMPRADORES_SERVICE_URL:http://localhost:8081}
%dev.quarkus.rest-client.veiculos.url=${DEV_VEICULOS_SERVICE_URL:http://localhost:8082}
%dev.quarkus.rest-client.financeiro.url=${DEV_FINANCEIRO_SERVICE_URL:http://localhost:8084}
%dev.quarkus.oidc.auth-server-url=${DEV_COGNITO_ISSUER_URL:${COGNITO_ISSUER_URL:https://cognito-idp.sa-east-1.amazonaws.com/sa-east-1_H59laNeJi}}

%dev.kafka.bootstrap.servers=${DEV_KAFKA_SERVER:localhost:9092}

mp.messaging.outgoing.financeiro-out.connector=smallrye-kafka
mp.messaging.outgoing.financeiro-out.topic=financeiro

mp.messaging.incoming.financeiro-in.connector=smallrye-kafka
mp.messaging.incoming.financeiro-in.topic=financeiro-ack
