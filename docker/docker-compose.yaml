services:
  sub3-postgres:
    image: postgres:18.4
    container_name: sub3-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./ddl.sql:/docker-entrypoint-initdb.d/01-ddl.sql:ro,Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  sub3-keycloak:
    image: quay.io/keycloak/keycloak:26.6
    container_name: sub3-keycloak
    restart: unless-stopped
    command:
      - start-dev
      - --import-realm
    environment:
      KEYCLOAK_ADMIN: sub3
      KEYCLOAK_ADMIN_PASSWORD: sub3
    ports:
      - "8080:8080"
    volumes:
      - ./sub3-realm.json:/opt/keycloak/data/import/sub3-realm.json:ro,Z

  sub3-nats:
    image: nats:2.14.4-linux
    container_name: sub3-nats
    restart: unless-stopped
    ports:
      - "4222:4222"
