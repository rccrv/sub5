quarkus.http.port=8082
quarkus.http.access-log.enabled=true
quarkus.rest-client.compound-debug.url=http://localhost:8081/

# Incoming bearer token validation for protected endpoints.
quarkus.oidc.auth-server-url=${KEYCLOAK_REALM_URL:http://keycloak/auth/realms/sub3}
quarkus.oidc.client-id=${KEYCLOAK_CLIENT_ID:princpal}
quarkus.oidc.credentials.secret=${KEYCLOAK_CLIENT_SECRET}
quarkus.oidc.application-type=service
# TODO: Usar HTTP no k8s com cert-manager
quarkus.oidc-client.auth-server-url=${KEYCLOAK_REALM_URL:http://keycloak/auth/realms/sub3}
quarkus.oidc-client.client-id=${KEYCLOAK_CLIENT_ID:principal}
quarkus.oidc-client.credentials.secret=${KEYCLOAK_CLIENT_SECRET}

quarkus.datasource.devservices.enabled=false
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${POSTGRES_USER:sub3}
quarkus.datasource.password=${POSTGRES_PASSWORD:sub3}
quarkus.datasource.jdbc.url=${POSTGRES_URL:jdbc:postgresql://postgres:5432/princpal}

# TODO: Mudar a porta do serviço keycloak
%dev.quarkus.smallrye-openapi.security-scheme=jwt
%dev.quarkus.oidc.auth-server-url=${DEV_KEYCLOAK_REALM_URL:http://localhost:8080/auth/realms/sub3}
%dev.quarkus.oidc.client-id=${DEV_KEYCLOAK_CLIENT_ID:princpal}
%dev.quarkus.oidc.credentials.secret=${DEV_KEYCLOAK_CLIENT_SECRET}
%dev.quarkus.oidc.application-type=service
%dev.quarkus.oidc-client.auth-server-url=${DEV_KEYCLOAK_REALM_URL:http://localhost:8080/auth/realms/sub3}
%dev.quarkus.oidc-client.client-id=${DEV_KEYCLOAK_CLIENT_ID:principal}
%dev.quarkus.oidc-client.credentials.secret=${DEV_KEYCLOAK_CLIENT_SECRET}

%dev.quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.username=${DEV_POSTGRES_USER:sub3}
%dev.quarkus.datasource.password=${DEV_POSTGRES_PASSWORD:sub3}
%dev.quarkus.datasource.jdbc.url=${DEV_POSTGRES_URL:jdbc:postgresql://localhost:5432/principal}